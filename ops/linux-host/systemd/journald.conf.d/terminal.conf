# W6.04: bound the persistent journal so runtime logging cannot fill the OS
# disk. Install to /etc/systemd/journald.conf.d/terminal.conf and
# `systemctl restart systemd-journald`. Numbers are a conservative starting
# point; W6.15 tunes them against real log volume.
[Journal]
Storage=persistent
SystemMaxUse=2G
SystemKeepFree=5G
MaxRetentionSec=2week
MaxFileSec=1day
