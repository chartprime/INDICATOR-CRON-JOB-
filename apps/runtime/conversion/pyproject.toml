[project]
name = "terminal-historical-conversion"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.40,<2",
  "databento-dbn==0.69.0",
  "duckdb==1.5.5",
  "zstandard>=0.23,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "jsonschema>=4.20,<5",
    "pytest-xdist>=3.6,<4",
    "pytest-cov>=7.1,<8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
